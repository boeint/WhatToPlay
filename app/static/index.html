<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What To Play — Game Backlog</title>
<link rel="stylesheet" href="styles.css">
<script type="module" src="app.js"></script>
</head>
<body>
<header>
  <h1>What<span>To</span>Play</h1>
  <button class="btn-roll" data-action="pick">🎲 What to play next</button>
  <span class="save-state" id="save-state" aria-live="polite"></span>
  <div class="grow"></div>
  <div class="stats" id="stats"></div>
</header>

<div class="bar" id="toolbar">
  <input type="search" id="search" placeholder="Search games, platforms, notes…" aria-label="Search">
  <select id="filter" aria-label="Status filter">
    <option value="all">All statuses</option>
    <option value="unplayed">Unplayed</option>
    <option value="playing">Playing</option>
    <option value="finished">Finished</option>
    <option value="skip">Skip</option>
  </select>
  <select id="sort" aria-label="Sort franchises">
    <option value="az">Sort: A–Z</option>
    <option value="custom">Sort: custom</option>
    <option value="remaining">Sort: most remaining</option>
  </select>
  <button data-action="expand-all">Expand all</button>
  <button data-action="collapse-all">Collapse all</button>
  <div class="grow"></div>
  <button data-action="add-franchise">+ Franchise</button>
  <button class="btn-ghost" data-action="export" title="Download all your data as a backup file">Export</button>
  <button class="btn-ghost" data-action="import" title="Replace all data with a backup file">Import</button>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
</div>

<div class="error" id="problem" hidden></div>
<main id="app"><div class="empty">Loading…</div></main>

<div class="backdrop" id="backdrop" hidden></div>
<aside class="panel" id="panel" aria-label="Game details" hidden></aside>

<div class="ov" id="picker"></div>
<div class="ov" id="dialog"></div>

<div class="toast" id="toast"></div>
</body>
</html>
