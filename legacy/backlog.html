<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What To Play — Game Backlog</title>
<style>
  :root{
    --bg:#0f1117; --panel:#171a23; --panel2:#1f2330; --line:#2a2f3e;
    --txt:#e6e8ee; --mut:#9aa3b5; --acc:#7c5cff; --acc2:#00d8a4;
    --done:#3ddc84; --skip:#6b7280; --play:#ffb020; --un:#5b6478;
    --danger:#ff5d5d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--acc2)}
  header{position:sticky;top:0;z-index:20;background:rgba(15,17,23,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;letter-spacing:.3px;white-space:nowrap}
  header h1 span{color:var(--acc)}
  .grow{flex:1}
  .stats{display:flex;gap:14px;color:var(--mut);font-size:13px;flex-wrap:wrap}
  .stats b{color:var(--txt)}
  button{cursor:pointer;font:inherit;border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:9px;padding:8px 12px;transition:.15s}
  button:hover{border-color:var(--acc);background:#262b3a}
  .btn-primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
  .btn-primary:hover{background:#6b49ff}
  .btn-roll{background:linear-gradient(135deg,var(--acc),#9b7bff);border:none;color:#fff;font-weight:700;padding:9px 16px;font-size:15px}
  .btn-ghost{background:transparent}
  input,select,textarea{font:inherit;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:6px 8px;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--acc)}
  .bar{display:flex;gap:10px;padding:14px 20px;align-items:center;flex-wrap:wrap}
  .bar input[type=search]{min-width:220px;flex:1;max-width:340px}
  main{padding:4px 16px 80px;max-width:none;margin:0}
  .fr{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
  .fr-head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(90deg,#20242f,#191d28);cursor:pointer;user-select:none}
  .fr.open .fr-head{border-bottom:1px solid var(--line)}
  .caret{color:var(--mut);font-size:12px;width:14px;transition:transform .15s;flex:0 0 auto}
  .fr.open .caret{transform:rotate(90deg)}
  .fr-title{font-size:18px;font-weight:500;border:none;background:transparent;flex:0 0 auto;width:auto;min-width:120px;padding:4px 6px;border-radius:6px}
  .fr-title:hover,.fr-title:focus{background:var(--panel2)}
  .fr-prog{font-size:12px;color:var(--mut);background:var(--panel2);padding:3px 9px;border-radius:20px;white-space:nowrap}
  .fr-actions{display:flex;gap:6px;margin-left:auto}
  .fr-actions button{padding:6px 10px;font-size:13px}
  .ondeck{font-size:12px;color:var(--acc2);background:rgba(0,216,164,.08);border:1px solid rgba(0,216,164,.25);padding:3px 9px;border-radius:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
  .fr-body{display:none}
  .fr.open .fr-body{display:block}
  .fr-notes{padding:10px 14px 6px;display:flex;gap:8px;align-items:flex-start}
  .games-frame{margin:2px 14px 14px;border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:10px;overflow:hidden;background:#262c3d}
  .fr-notes textarea{flex:1;min-height:34px;resize:vertical;font-size:13px;color:var(--mut)}
  .fr-notes .lbl{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;padding-top:8px;width:50px;flex:0 0 auto}
  table{width:100%;border-collapse:collapse;table-layout:fixed}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);text-align:left;padding:8px 10px;font-weight:600;border-bottom:1px solid var(--line);position:relative;overflow:hidden;white-space:nowrap}
  td{padding:6px 10px;border-bottom:1px solid #20242f;vertical-align:middle;overflow:hidden}
  .rz{position:absolute;top:0;right:-1px;width:9px;height:100%;cursor:col-resize;z-index:3}
  .rz:hover{background:rgba(124,92,255,.55)}
  .rz:active{background:var(--acc)}
  body.resizing{cursor:col-resize;user-select:none}
  tr:last-child td{border-bottom:none}
  tr.done{opacity:.5}
  tr.skip{opacity:.4}
  tr.ondeck-row{background:transparent}
  .ord{display:flex;flex-direction:column;gap:1px}
  .ord button{padding:0 5px;font-size:10px;line-height:14px;border-radius:4px;background:transparent;border-color:transparent;color:var(--mut)}
  .ord button:hover{color:var(--txt);background:var(--panel2)}
  .t-title{padding-left:24px}
  .gmark{flex:0 0 auto;color:var(--acc);opacity:.65;font-size:11px}
  .title-wrap{display:flex;align-items:center;gap:6px}
  .title-wrap input{flex:1;min-width:60px;font-weight:500;font-size:14px;color:#c5cbdb;background:transparent;border:1px solid transparent;border-radius:7px;padding:6px 8px}
  .title-wrap input:hover,.title-wrap input:focus{background:var(--panel2);border-color:var(--line)}
  .bl{flex:0 0 auto;display:inline-flex;align-items:center;text-decoration:none;opacity:.8;line-height:0}
  .bl:hover{opacity:1}
  .bl img{width:16px;height:16px;border-radius:3px;display:block}
  .t-rel input{width:84px;background:transparent;border-color:transparent;color:var(--mut);font-size:13px}
  .t-rel input:hover,.t-rel input:focus{background:var(--panel2);border-color:var(--line)}
  .plat-cell{cursor:pointer;min-height:30px;display:flex;flex-wrap:wrap;gap:3px;align-items:center;padding:3px 4px;border-radius:6px;border:1px solid transparent}
  .plat-cell:hover{border-color:var(--line);background:var(--panel2)}
  .chip{font-size:11px;background:#2b3040;border:1px solid var(--line);color:#c7cde0;padding:1px 7px;border-radius:20px;white-space:nowrap}
  .plat-cell .ph{color:var(--un);font-size:12px}
  select.status{font-size:12px;font-weight:700;border-radius:20px;padding:4px 8px;appearance:none;text-align:center}
  select.status.unplayed{color:var(--un)}
  select.status.playing{color:var(--play);border-color:var(--play)}
  select.status.finished{color:var(--done);border-color:var(--done)}
  select.status.skip{color:var(--skip)}
  .t-notes input{width:100%;background:transparent;border-color:transparent;color:var(--mut);font-size:13px}
  .t-notes input:hover,.t-notes input:focus{background:var(--panel2);border-color:var(--line)}
  .t-links{white-space:nowrap}
  .t-links a{margin-right:6px;font-size:12px}
  .lnkbtn{font-size:11px;color:var(--mut);background:transparent;border-color:transparent;padding:2px 6px}
  .del{color:var(--danger);background:transparent;border-color:transparent;font-size:15px;padding:2px 8px}
  .del:hover{background:rgba(255,93,93,.12);border-color:transparent}
  .fr-foot{padding:8px 14px;border-top:1px solid #20242f}
  .fr-foot button{font-size:13px;color:var(--mut)}
  .ov{position:fixed;inset:0;background:rgba(5,7,12,.7);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .ov.on{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .modal h2{margin:0 0 4px}
  .roll-card{text-align:center;padding:10px 0 4px}
  .roll-fr{color:var(--acc);font-size:13px;text-transform:uppercase;letter-spacing:1px;font-weight:700}
  .roll-game{font-size:30px;font-weight:800;margin:8px 0}
  .roll-plat{color:var(--mut);font-size:15px}
  .roll-note{color:var(--mut);font-size:13px;margin-top:10px;font-style:italic}
  .roll-actions{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
  .filter-roll{display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:6px;font-size:13px;color:var(--mut)}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin:14px 0;max-height:48vh;overflow:auto}
  .pgrid label{display:flex;gap:7px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13px;cursor:pointer}
  .pgrid label:hover{border-color:var(--acc)}
  .pgrid input{width:auto}
  .empty{color:var(--mut);text-align:center;padding:50px;font-size:15px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;opacity:0;transition:.3s;z-index:60;pointer-events:none}
  .toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <h1>What<span>To</span>Play</h1>
  <button class="btn-roll" onclick="openRoll()">🎲 What to play next</button>
  <div class="grow"></div>
  <div class="stats" id="stats"></div>
</header>

<div class="bar">
  <input type="search" id="search" placeholder="Search games or franchises…" oninput="render()">
  <select id="filter" onchange="render()">
    <option value="all">All statuses</option>
    <option value="unplayed">Unplayed</option>
    <option value="playing">Playing</option>
    <option value="finished">Finished</option>
    <option value="skip">Skip</option>
  </select>
  <select id="sortfr" onchange="render()">
    <option value="az" selected>Sort: A–Z</option>
    <option value="custom">Sort: custom</option>
    <option value="remaining">Sort: most remaining</option>
  </select>
  <button onclick="expandAll(true)">Expand all</button>
  <button onclick="expandAll(false)">Collapse all</button>
  <div class="grow"></div>
  <button onclick="addFranchise()">+ Franchise</button>
  <button class="btn-ghost" onclick="exportData()">Export</button>
  <button class="btn-ghost" onclick="document.getElementById('imp').click()">Import</button>
  <input type="file" id="imp" accept="application/json" style="display:none" onchange="importData(event)">
</div>

<main id="app"></main>

<div class="ov" id="rollOv">
  <div class="modal">
    <div class="filter-roll">Pick from:
      <select id="rollScope" onchange="doRoll()"><option value="all">any franchise</option></select>
    </div>
    <div id="rollBody"></div>
    <div class="roll-actions">
      <button class="btn-roll" onclick="doRoll()">🎲 Re-roll</button>
      <button onclick="markRollPlaying()">Set as Playing</button>
      <button class="btn-ghost" onclick="closeRoll()">Close</button>
    </div>
  </div>
</div>

<div class="ov" id="linkOv">
  <div class="modal">
    <h2 style="font-size:18px">Links</h2>
    <p style="color:var(--mut);font-size:13px;margin:4px 0 12px">One per line: <code>Label | https://url</code> (or just a URL)</p>
    <textarea id="linkText" style="width:100%;min-height:140px"></textarea>
    <div class="roll-actions" style="justify-content:flex-end">
      <button class="btn-primary" onclick="saveLinks()">Save</button>
      <button class="btn-ghost" onclick="document.getElementById('linkOv').classList.remove('on')">Cancel</button>
    </div>
  </div>
</div>

<div class="ov" id="platOv">
  <div class="modal">
    <h2 style="font-size:18px">Platforms</h2>
    <p style="color:var(--mut);font-size:13px;margin:4px 0 0" id="platFor"></p>
    <div class="pgrid" id="platGrid"></div>
    <div class="roll-actions" style="justify-content:flex-end">
      <button class="btn-primary" onclick="savePlats()">Save</button>
      <button class="btn-ghost" onclick="document.getElementById('platOv').classList.remove('on')">Cancel</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

// ===== state & persistence =====
const STORE_KEY="whattoplay.v1";
const SEEDV_KEY="whattoplay.seedv";
const EXP_KEY="whattoplay.expanded";
const SEED_VERSION=38; // bump to merge new SEED content into already-saved data
const uid=p=>p+Math.random().toString(36).slice(2,9);
const norm=s=>String(s==null?"":s).trim().toLowerCase();

function hydrate(){
  return SEED.map((f,fi)=>({
    id:"f"+fi+"_seed", name:f.name, notes:f.notes||"",
    games:f.games.map(g=>({id:uid("g"),title:g.t,released:g.r||"",platform:(g.p||[]).slice(),status:"unplayed",notes:"",links:[]}))
  }));
}

function reconcile(saved){
  const seedByName={}; SEED.forEach(f=>seedByName[norm(f.name)]=f);
  const savedNames=new Set(saved.map(f=>norm(f.name)));
  saved.forEach(f=>{
    const sf=seedByName[norm(f.name)];
    const tmap={}; if(sf) sf.games.forEach(g=>tmap[norm(g.t)]={r:g.r||"",p:(g.p||[]).slice()});
    // backfill released + platform-as-array onto existing games (match by title)
    f.games.forEach(g=>{
      if(!Array.isArray(g.platform)){
        const guess=String(g.platform||"").split(/[\/,]/).map(s=>s.trim());
        g.platform=PLATFORMS.filter(p=>guess.some(x=>norm(x)===norm(p)));
      }
      const hit=tmap[norm(g.title)];
      if(hit){
        if(g.released==null||g.released==="") g.released=hit.r;
        if(!g.platform.length) g.platform=hit.p.slice();
      }
      if(g.released==null) g.released="";
      if(!Array.isArray(g.links)) g.links=[];
    });
    // add SEED games new to an existing franchise (e.g. Pokémon Pokopia)
    if(sf){
      const have=new Set(f.games.map(g=>norm(g.title)));
      sf.games.forEach(g=>{ if(!have.has(norm(g.t)))
        f.games.push({id:uid("g"),title:g.t,released:g.r||"",platform:(g.p||[]).slice(),status:"unplayed",notes:"",links:[]}); });
    }
  });
  // add whole franchises that are new in SEED
  hydrate().forEach(hf=>{ if(!savedNames.has(norm(hf.name))) saved.push(hf); });
  return saved;
}

function load(){
  let d;
  try{ const raw=localStorage.getItem(STORE_KEY); if(raw) d=JSON.parse(raw); }catch(e){}
  if(!Array.isArray(d)){ d=hydrate(); }
  else { const sv=parseInt(localStorage.getItem(SEEDV_KEY)||"0",10); if(sv<SEED_VERSION) d=reconcile(d); }
  normalizeBL(d); // migrate any backloggd link already in Links into g.bl
  return d;
}

let data=load();
function save(){ localStorage.setItem(STORE_KEY,JSON.stringify(data)); localStorage.setItem(SEEDV_KEY,String(SEED_VERSION)); refreshStats(); }
save(); // persist any reconcile result so it runs once

// expanded set (collapsed by default => empty)
let expanded=new Set(); // always start collapsed on load, regardless of last session
function saveExpanded(){ localStorage.setItem(EXP_KEY,JSON.stringify([...expanded])); }

// resizable column widths (shared across all franchise tables)
const COLDEF={released:92,platform:200,status:110,notes:200,links:80};
let colW=Object.assign({},COLDEF);
try{ const c=JSON.parse(localStorage.getItem("whattoplay.cols")||"null"); if(c) colW=Object.assign(colW,c); }catch(e){}
function saveColW(){ localStorage.setItem("whattoplay.cols",JSON.stringify(colW)); }
function colgroup(){ return `<colgroup><col>`+
  ["released","platform","status","notes","links"].map(k=>`<col data-col="${k}" style="width:${colW[k]}px">`).join("")+
  `<col style="width:34px"><col style="width:34px"></colgroup>`; }

const STATUSES=[["unplayed","Unplayed"],["playing","Playing"],["finished","Finished"],["skip","Skip"]];
function frRemaining(f){ return f.games.filter(g=>g.status!=="finished"&&g.status!=="skip").length; }
function onDeck(f){ return f.games.find(g=>g.status!=="finished"&&g.status!=="skip")||null; }

// ===== render =====
function render(){
  const app=document.getElementById("app");
  const q=norm(document.getElementById("search").value);
  const filt=document.getElementById("filter").value;
  const sort=document.getElementById("sortfr").value;

  let list=data.map((f,idx)=>({f,idx}));
  if(sort==="az") list.sort((a,b)=>a.f.name.localeCompare(b.f.name));
  if(sort==="remaining") list.sort((a,b)=>frRemaining(b.f)-frRemaining(a.f));

  let html="";
  for(const {f,idx} of list){
    const matchFr=!q||norm(f.name).includes(q);
    let games=f.games.map((g,gi)=>({g,gi})).filter(({g})=>{
      const okq=!q||matchFr||norm(g.title).includes(q)||(g.platform||[]).some(p=>norm(p).includes(q));
      const okf=filt==="all"||g.status===filt;
      return okq&&okf;
    });
    if(games.length===0){
      if(filt!=="all") continue;   // status filter active: hide franchises with no game of that status
      if(q && !matchFr) continue;  // search active: hide franchises that don't match
    }

    const deck=onDeck(f), rem=frRemaining(f), total=f.games.length;
    const isOpen=expanded.has(f.id)||(q&&games.length>0)||(filt!=="all"&&games.length>0);
    html+=`<div class="fr ${isOpen?'open':''}" data-fr="${idx}">
      <div class="fr-head" onclick="toggleFr('${f.id}',event)">
        <span class="caret">▶</span>
        <input class="fr-title" value="${esc(f.name)}" onclick="event.stopPropagation()" onchange="editFr(${idx},'name',this.value)">
        <span class="fr-prog">${total-rem}/${total} done</span>
        ${deck?`<span class="ondeck" title="Next up">▶ ${esc(deck.title)}</span>`:`<span class="fr-prog" style="color:var(--done)">✓ complete</span>`}
        <div class="fr-actions">
          <button onclick="event.stopPropagation();addGame(${idx})">+ Game</button>
          <button class="del" title="Delete franchise" onclick="event.stopPropagation();delFr(${idx})">🗑</button>
        </div>
      </div>
      <div class="fr-body">
        <div class="fr-notes">
          <span class="lbl">Notes</span>
          <textarea onchange="editFr(${idx},'notes',this.value)">${esc(f.notes)}</textarea>
        </div>
        <div class="games-frame"><table>${colgroup()}<thead><tr>
          <th>Title</th>
          <th>Released<span class="rz" data-col="released"></span></th>
          <th>Platform<span class="rz" data-col="platform"></span></th>
          <th>Status<span class="rz" data-col="status"></span></th>
          <th>Notes<span class="rz" data-col="notes"></span></th>
          <th>Links<span class="rz" data-col="links"></span></th>
          <th></th><th></th>
        </tr></thead><tbody>`;
    for(const {g,gi} of games){
      const isDeck=deck&&deck.id===g.id;
      const chips=(g.platform||[]).length?(g.platform.map(p=>`<span class="chip">${esc(p)}</span>`).join("")):`<span class="ph">+ platform</span>`;
      html+=`<tr class="${g.status} ${isDeck?'ondeck-row':''}">
        <td class="t-title"><div class="title-wrap"><span class="gmark">▹</span><input value="${esc(g.title)}" onchange="editGame(${idx},${gi},'title',this.value)"><a class="bl" href="${esc(blUrl(g))}" target="_blank" rel="noopener" title="Open on Backloggd"><img src="https://backloggd.com/favicon.ico" onerror="this.onerror=null;this.src='https://www.google.com/s2/favicons?domain=backloggd.com&amp;sz=64'" alt="Backloggd"></a></div></td>
        <td class="t-rel"><input value="${esc(g.released)}" placeholder="Mon YYYY" onchange="editGame(${idx},${gi},'released',this.value)"></td>
        <td><div class="plat-cell" onclick="editPlats(${idx},${gi})">${chips}</div></td>
        <td><select class="status ${g.status}" onchange="editGame(${idx},${gi},'status',this.value)">
          ${STATUSES.map(s=>`<option value="${s[0]}" ${g.status===s[0]?'selected':''}>${s[1]}</option>`).join('')}
        </select></td>
        <td class="t-notes"><input value="${esc(g.notes)}" onchange="editGame(${idx},${gi},'notes',this.value)"></td>
        <td class="t-links">${(g.links||[]).map(l=>`<a href="${esc(l.url)}" target="_blank" title="${esc(l.url)}">${esc(l.label||'link')}</a>`).join('')}
          <button class="lnkbtn" onclick="editLinks(${idx},${gi})">＋</button></td>
        <td><div class="ord">
          <button title="Up" onclick="moveGame(${idx},${gi},-1)">▲</button>
          <button title="Down" onclick="moveGame(${idx},${gi},1)">▼</button>
        </div></td>
        <td><button class="del" title="Delete game" onclick="delGame(${idx},${gi})">×</button></td>
      </tr>`;
    }
    html+=`</tbody></table>
      <div class="fr-foot"><button onclick="addGame(${idx})">+ Add game to ${esc(f.name)}</button></div>
    </div></div></div>`;
  }
  app.innerHTML=html||`<div class="empty">No matches. <button class="btn-ghost" onclick="document.getElementById('search').value='';document.getElementById('filter').value='all';render()">reset</button></div>`;
  refreshStats();
}

function refreshStats(){
  let total=0,done=0,playing=0,rem=0;
  data.forEach(f=>f.games.forEach(g=>{ total++;
    if(g.status==="finished")done++; else if(g.status==="playing")playing++;
    if(g.status!=="finished"&&g.status!=="skip")rem++; }));
  document.getElementById("stats").innerHTML=
    `<span>📚 <b>${data.length}</b> franchises</span><span>🎮 <b>${total}</b> games</span>
     <span>✅ <b>${done}</b> done</span><span>▶ <b>${playing}</b> playing</span><span>⏳ <b>${rem}</b> left</span>`;
}

// ===== collapse =====
function toggleFr(id,e){ if(e)e.stopPropagation(); if(expanded.has(id))expanded.delete(id); else expanded.add(id); saveExpanded(); render(); }
function expandAll(on){ expanded=on?new Set(data.map(f=>f.id)):new Set(); saveExpanded(); render(); }

// ===== edits =====
function editFr(i,k,v){ data[i][k]=v; save(); }
function editGame(i,gi,k,v){ data[i].games[gi][k]=v; save(); if(k==="status")render(); }
function addGame(i){ if(!expanded.has(data[i].id)){expanded.add(data[i].id);saveExpanded();} data[i].games.push({id:uid("g"),title:"New game",released:"",platform:[],status:"unplayed",notes:"",links:[]}); save(); render(); }
function delGame(i,gi){ if(confirm("Delete this game?")){ data[i].games.splice(gi,1); save(); render(); } }
function moveGame(i,gi,dir){ const j=gi+dir,a=data[i].games; if(j<0||j>=a.length)return; [a[gi],a[j]]=[a[j],a[gi]]; save(); render(); }
function addFranchise(){ const name=prompt("Franchise name (use the game's name if standalone):"); if(!name)return;
  const f={id:uid("f"),name,notes:"",games:[{id:uid("g"),title:name,released:"",platform:[],status:"unplayed",notes:"",links:[]}]};
  data.unshift(f); expanded.add(f.id); saveExpanded(); save(); render(); window.scrollTo(0,0); }
function delFr(i){ if(confirm(`Delete franchise "${data[i].name}" and all its games?`)){ data.splice(i,1); save(); render(); } }

// ===== platforms picker =====
let platTarget=null;
function editPlats(i,gi){ platTarget=[i,gi]; const g=data[i].games[gi]; const sel=new Set(g.platform||[]);
  document.getElementById("platFor").textContent=g.title;
  document.getElementById("platGrid").innerHTML=PLATFORMS.map(p=>
    `<label><input type="checkbox" value="${esc(p)}" ${sel.has(p)?'checked':''}> ${esc(p)}</label>`).join("");
  document.getElementById("platOv").classList.add("on"); }
function savePlats(){ const [i,gi]=platTarget;
  data[i].games[gi].platform=[...document.querySelectorAll("#platGrid input:checked")].map(c=>c.value);
  document.getElementById("platOv").classList.remove("on"); save(); render(); }

// ===== links =====
let linkTarget=null;
function editLinks(i,gi){ linkTarget=[i,gi]; const links=data[i].games[gi].links||[];
  document.getElementById("linkText").value=links.map(l=>`${l.label||''} | ${l.url}`).join("\n");
  document.getElementById("linkOv").classList.add("on"); }
function saveLinks(){ const [i,gi]=linkTarget; const g=data[i].games[gi];
  const lines=document.getElementById("linkText").value.split("\n").map(s=>s.trim()).filter(Boolean);
  let links=lines.map(line=>{ if(line.includes("|")){const [lab,url]=line.split("|");return{label:lab.trim(),url:url.trim()};} return{label:"link",url:line}; });
  const bl=links.find(l=>/backloggd\.com/i.test(l.url||""));
  if(bl){ g.bl=bl.url; links=links.filter(l=>!/backloggd\.com/i.test(l.url||"")); } // backloggd link overrides the icon, not shown as a link
  g.links=links;
  document.getElementById("linkOv").classList.remove("on"); save(); render(); }

// ===== roll =====
let lastRoll=null;
function buildRollScope(){ const sel=document.getElementById("rollScope"),cur=sel.value;
  sel.innerHTML=`<option value="all">any franchise</option>`+data.map((f,i)=>onDeck(f)?`<option value="${i}">${esc(f.name)}</option>`:"").join("");
  if([...sel.options].some(o=>o.value===cur))sel.value=cur; }
function openRoll(){ buildRollScope(); document.getElementById("rollOv").classList.add("on"); doRoll(); }
function closeRoll(){ document.getElementById("rollOv").classList.remove("on"); }
function doRoll(){ const scope=document.getElementById("rollScope").value; let cands=[];
  data.forEach((f,i)=>{ if(scope!=="all"&&String(i)!==scope)return; const d=onDeck(f); if(d)cands.push({fr:f.name,fi:i,game:d}); });
  const body=document.getElementById("rollBody");
  if(!cands.length){ body.innerHTML=`<div class="roll-card"><div class="roll-game">🎉 All caught up!</div><div class="roll-plat">Nothing left in scope.</div></div>`; lastRoll=null; return; }
  const pick=cands[Math.floor(Math.random()*cands.length)]; lastRoll=pick;
  const plat=(pick.game.platform||[]).join(" · ")||"platform: tbd";
  body.innerHTML=`<div class="roll-card"><div class="roll-fr">${esc(pick.fr)}</div>
    <div class="roll-game"><a href="${esc(blUrl(pick.game))}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;border-bottom:2px solid rgba(255,90,60,.5)">${esc(pick.game.title)}</a></div>
    <div class="roll-plat">${esc(plat)}${pick.game.released?` — ${esc(pick.game.released)}`:''}</div>
    ${pick.game.notes?`<div class="roll-note">"${esc(pick.game.notes)}"</div>`:''}</div>`; }
function markRollPlaying(){ if(!lastRoll)return; lastRoll.game.status="playing"; save(); render(); toast(`Marked "${lastRoll.game.title}" as Playing`); buildRollScope(); doRoll(); }

// ===== import / export =====
function exportData(){ const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}); const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="game-backlog-"+new Date().toISOString().slice(0,10)+".json"; a.click(); toast("Exported backup JSON"); }
function importData(ev){ const file=ev.target.files[0]; if(!file)return; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(Array.isArray(d)){ data=d; save(); render(); toast("Imported"); } else alert("Invalid file."); }catch(e){ alert("Could not parse file."); } };
  r.readAsText(file); ev.target.value=""; }

// ===== util =====
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// best-guess Backloggd slug from a title (matches IGDB-style slugs)
function blSlug(title){
  let s=String(title||"").split(" / ")[0];          // for "Red / Blue" pairs, use first variant
  s=s.replace(/\bGTA\b/g,"Grand Theft Auto");        // expand abbreviation
  s=s.replace(/\([^)]*\)/g," ");                     // drop (1996), (Remake), etc.
  s=s.normalize("NFD").replace(/[̀-ͯ]/g,"");// strip accents (Pokémon→Pokemon)
  s=s.toLowerCase().replace(/['’]/g,"");             // drop apostrophes
  s=s.replace(/&/g," ");                              // drop ampersands
  s=s.replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").replace(/-+/g,"-");
  return s;
}
// Backloggd URL for a game: a saved override (g.bl) wins, else the auto-slug
function blUrl(g){ return g.bl ? g.bl : ("https://backloggd.com/games/"+blSlug(g.title)+"/"); }
// move any backloggd.com link out of a game's Links and into its g.bl override
function normalizeBL(d){ d.forEach(f=>(f.games||[]).forEach(g=>{
  if(!Array.isArray(g.links)) g.links=[];
  const k=g.links.find(l=>/backloggd\.com/i.test(l.url||""));
  if(k){ g.bl=k.url; g.links=g.links.filter(l=>!/backloggd\.com/i.test(l.url||"")); }
})); }
let toastT; function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),2200); }
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ closeRoll(); document.getElementById("linkOv").classList.remove("on"); document.getElementById("platOv").classList.remove("on"); } });

// column resizing (live across every table, persisted)
let rz=null;
document.addEventListener("mousedown",e=>{ const h=e.target.closest(".rz"); if(!h)return;
  e.preventDefault(); rz={col:h.dataset.col,x:e.clientX,w:colW[h.dataset.col]}; document.body.classList.add("resizing"); });
document.addEventListener("mousemove",e=>{ if(!rz)return;
  const w=Math.max(50,rz.w+(e.clientX-rz.x)); colW[rz.col]=w;
  document.querySelectorAll(`col[data-col="${rz.col}"]`).forEach(c=>c.style.width=w+"px"); });
document.addEventListener("mouseup",()=>{ if(rz){ rz=null; document.body.classList.remove("resizing"); saveColW(); } });

render();
</script>
