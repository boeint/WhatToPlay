# Build the container image, test it against a real MariaDB, then publish it to
# GitHub's container registry (ghcr.io).
#   push to main        -> ghcr.io/boeint/whattoplay:dev
#   release tag v1.2.3  -> ghcr.io/boeint/whattoplay:latest, :1.2.3 and :1.2
name: Container image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:       # "Run workflow" button on GitHub

permissions:
  contents: read
  packages: write          # allows publishing to ghcr.io

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/whattoplay

jobs:
  # 1. The test suite, against a throwaway MariaDB. Nothing is built if it fails.
  tests:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: whattoplay_test
          MARIADB_USER: whattoplay
          MARIADB_PASSWORD: test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: whattoplay
      DB_PASSWORD: test
      TEST_DB_NAME: whattoplay_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest

  # 2. Build the image, test it as a container, publish it.
  build-test-publish:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the image (not published yet)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: whattoplay:test

      - name: Test the image against a throwaway MariaDB
        run: |
          set -e
          docker network create test
          docker run -d --name db --network test \
            -e MARIADB_ROOT_PASSWORD=root -e MARIADB_DATABASE=whattoplay \
            -e MARIADB_USER=whattoplay -e MARIADB_PASSWORD=test mariadb:11
          # A backup folder owned by root, as Docker creates a missing host folder.
          sudo mkdir "$RUNNER_TEMP/backups"
          # Started right away on purpose: the app must wait for the database itself.
          docker run -d --name app --network test -p 8000:8000 -e TZ=America/New_York \
            -e DB_HOST=db -e DB_NAME=whattoplay -e DB_USER=whattoplay -e DB_PASSWORD=test \
            -v "$RUNNER_TEMP/backups:/backups" \
            whattoplay:test
          for i in $(seq 1 40); do
            curl -fsS http://localhost:8000/api/health && break
            sleep 3
          done
          echo; echo "--- checks ---"
          curl -fsS http://localhost:8000/api/health | grep -q '"database":"ok"'
          curl -fsS http://localhost:8000/ | grep -q "<title>What To Play"
          curl -fsS http://localhost:8000/icon.png -o /dev/null
          platforms=$(curl -fsS http://localhost:8000/api/platforms | python3 -c "import sys, json; print(len(json.load(sys.stdin)))")
          test "$platforms" = "31"
          tz=$(docker exec app python -c "import time; print(time.strftime('%Z'))")
          echo "time zone inside the container: $tz"
          case "$tz" in EST|EDT) ;; *) echo "TZ is not honored"; exit 1 ;; esac
          # The app's own process (PID 1) runs as 99:100, not root
          test "$(docker exec app stat -c %u:%g /proc/1)" = "99:100"
          # A start-up backup was written, owned by 99:100, and is a valid export
          sleep 3
          ls -ln "$RUNNER_TEMP/backups"
          backup=$(ls "$RUNNER_TEMP"/backups/whattoplay-export-*.json)
          test "$(stat -c %u:%g "$backup")" = "99:100"
          python3 -c "import json, sys; d = json.load(open(sys.argv[1])); assert d['format'] == 'whattoplay-export' and len(d['platforms']) == 31" "$backup"
          # The backup list shows it, and restoring it works and first saves a copy of the current data
          name=$(basename "$backup")
          curl -fsS http://localhost:8000/api/backups | grep -q "\"name\":\"$name\""
          curl -fsS -X POST "http://localhost:8000/api/backups/$name/restore?replace=true" | grep -q '"restored"'
          test "$(stat -c %u:%g "$RUNNER_TEMP"/backups/whattoplay-before-restore-*.json)" = "99:100"
          curl -fsS http://localhost:8000/api/health | grep -q '"enabled":true'
          # MCP: refused while the AI switch is off (the default)...
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/mcp/ \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')
          test "$code" = "403"
          # ...and usable by a real MCP client once switched on
          curl -fsS -X PATCH http://localhost:8000/api/settings -H 'Content-Type: application/json' -d '{"ai_enabled":true}' > /dev/null
          docker exec app python -c "
          import anyio
          from mcp.client import Client
          async def main():
              async with Client('http://127.0.0.1:8000/mcp/') as c:
                  names = sorted(t.name for t in (await c.list_tools()).tools)
                  print('MCP tools:', names)
                  assert 'add_franchise' in names and 'get_instructions' in names
          anyio.run(main)"
          echo "all checks passed"

      - name: Show the app's log
        if: always()
        run: docker logs app || true

      - name: Work out the image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
