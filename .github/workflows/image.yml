# Build the container image, test it against a real MariaDB, then publish it to
# GitHub's container registry (ghcr.io).
#   push to main        -> ghcr.io/boeint/whattoplay:dev
#   release tag v1.2.3  -> ghcr.io/boeint/whattoplay:latest, :1.2.3 and :1.2
name: Container image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:       # "Run workflow" button on GitHub

permissions:
  contents: read
  packages: write          # allows publishing to ghcr.io

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/whattoplay

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build the image (not published yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: whattoplay:test

      - name: Test the image against a throwaway MariaDB
        run: |
          set -e
          docker network create test
          docker run -d --name db --network test \
            -e MARIADB_ROOT_PASSWORD=root -e MARIADB_DATABASE=whattoplay \
            -e MARIADB_USER=whattoplay -e MARIADB_PASSWORD=test mariadb:11
          # Started right away on purpose: the app must wait for the database itself.
          docker run -d --name app --network test -p 8000:8000 -e TZ=America/New_York \
            -e DB_HOST=db -e DB_NAME=whattoplay -e DB_USER=whattoplay -e DB_PASSWORD=test \
            whattoplay:test
          for i in $(seq 1 40); do
            curl -fsS http://localhost:8000/api/health && break
            sleep 3
          done
          echo; echo "--- checks ---"
          curl -fsS http://localhost:8000/api/health | grep -q '"database":"ok"'
          curl -fsS http://localhost:8000/ | grep -q "WhatToPlay"
          curl -fsS http://localhost:8000/icon.png -o /dev/null
          platforms=$(curl -fsS http://localhost:8000/api/platforms | python3 -c "import sys, json; print(len(json.load(sys.stdin)))")
          test "$platforms" = "31"
          tz=$(docker exec app python -c "import time; print(time.strftime('%Z'))")
          echo "time zone inside the container: $tz"
          case "$tz" in EST|EDT) ;; *) echo "TZ is not honored"; exit 1 ;; esac
          echo "all checks passed"

      - name: Show the app's log
        if: always()
        run: docker logs app || true

      - name: Work out the image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
